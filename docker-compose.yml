# =============================================================
# DOCKER COMPOSE: ASISTENCIA VT by VALETEC
# Compatible con Docker Compose v1 y v2
# Puertos por defecto: Web App (3060) | PostgreSQL (5460)
# =============================================================

version: '3.8'

services:
  # 1. Base de Datos Relacional PostgreSQL 16
  asistencia-db:
    image: postgres:16-alpine
    container_name: asistencia-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-db_asistencia}
    ports:
      - "${DB_PORT:-5460}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backend-asistencia/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_asistencia}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # 2. Aplicación Web & API de Asistencia (Node.js Express)
  asistencia-app:
    build:
      context: ./backend-asistencia
      dockerfile: Dockerfile
    container_name: asistencia-app
    restart: always
    ports:
      - "${APP_PORT:-3060}:3000"
    environment:
      - PORT=3000
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_HOST=asistencia-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-db_asistencia}
    depends_on:
      asistencia-db:
        condition: service_healthy
