<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Login - Colegio Santa Teresa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1a252f; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Colegio Santa Teresa</h2>
        <p>Inicio de Sesión</p>
        
        <input type="text" id="usuario" placeholder="Usuario" required>
        <input type="password" id="contrasena" placeholder="Contraseña" required>
        
        <button onclick="iniciarSesion()">Entrar</button>
        <p id="mensajeError" style="color: red; display: none;">Usuario o contraseña incorrectos</p>
    </div>

    <script>
        function iniciarSesion() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('contrasena').value;

            // Esto luego lo conectaremos a la base de datos real, 
            // por ahora simulamos la redirección:
            if (user === 'papa_juan' && pass === '12345') {
                window.location.href = 'vista_padre.html';
            } else if (user === 'aux_maria' && pass === 'admin') {
                window.location.href = 'vista_auxiliar.html';
            } else {
                document.getElementById('mensajeError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
